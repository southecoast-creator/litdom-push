<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click the Subscribe Button Below</title>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "c3e1803c-f30b-4439-8404-82b9e9a160e3",
      });
    });
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at top right, rgba(212,175,55,.08), transparent 32%),
        #0B0B0F;
      color: #FFF8E7;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .litdom-logo {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 30px;
      color: #FFF8E7;
      margin-bottom: 26px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: linear-gradient(145deg, #19191F, #121217);
      border: 1px solid rgba(212,175,55,.24);
      border-radius: 22px;
      padding: 34px 26px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .label {
      margin: 0 0 10px;
      color: #F4D58D;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 21px;
      line-height: 1.3;
      color: #FFF8E7;
    }

    p.sub {
      margin: 0 0 26px;
      color: #C9BEA6;
      font-size: 14px;
      line-height: 1.6;
    }

    button.subscribe {
      width: 100%;
      padding: 14px 26px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #D4AF37, #A98520);
      color: #0B0B0F;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    button.subscribe:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(212,175,55,.20);
    }

    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #7A7365;
    }
  </style>
</head>
<body>
  <div>
    <div class="litdom-logo">Litdom</div>
    <div class="card">
      <p class="label">Litdom Notifications</p>
      <h2>Click the Subscribe Button Below</h2>
      <p class="sub">Get notified about new chapters, updates, and more — the moment they drop.</p>
      <button class="subscribe" onclick="OneSignal.Slidedown.promptPush()">Subscribe</button>
      <p class="note">You can turn this off anytime in your browser settings.</p>
    </div>
  </div>
</body>
</html>
